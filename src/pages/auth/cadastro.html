<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | THEMIS</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/auth.css">
</head>
<body>
    <header>
        <div class="opcoes">
            <div class="btn-voltar">
                <a href="../../../index.html">&larr; Voltar</a>
            </div>
            <div id="logar-cadastrar">
                <a href="login.html">Entrar</a>
            </div>
        </div>
        <div class="header-sign-up-in">
            <h1>Cadastre-se</h1>
            <p>Crie seu acesso ao Themis. Estamos construindo juntos um futuro mais consciente. 
                Preencha seus dados para começar.</p>
        </div>
    </header>

    <main>
        <form action="processa_cadastro.php" method="POST" class="forms">
            
            <div class="formulario">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>

            <div class="formulario">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="formulario">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="formulario">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required minlength="6">
            </div>

            <div class="altura-cadastrar">
                <button type="submit" class="salvar">CRIAR CONTA</button>
            </div>
        </form>
    </main>

</body>
</html>
