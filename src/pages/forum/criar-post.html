<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar forum | THEMIS</title>
    <link rel="stylesheet" href="../../styles/header.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/option-card.css">
    <link rel="stylesheet" href="../../styles/reset.css">
    <link rel="stylesheet" href="../../styles/button.css">
    <link rel="stylesheet" href="../../styles/navbar.css">
</head>
<body>
    <header>
        <div class="botoes-forum">
            <div class="btn-voltar">
                <a href="index.html">←</a>
            </div>
            <div>
                <a href="index.html" class="btn-postar">PUBLICAR</a>
            </div>
        </div>
    </header>
    <main>
        <div class="forum-postar">
            <div class="bitelo">
                <img src="../../image/bitelo.jpg" alt="Foto de perfil">
            </div>

            <form action="/topico/123/responder" method="post" class="card-postar">
                <textarea 
                    id="resposta" 
                    name="conteudo" 
                    rows="5" 
                    maxlength="5000"
                    placeholder="Estou pensando em..."
                    required></textarea>
            </form>
        </div>
    </main>
    
</body>
</html>
